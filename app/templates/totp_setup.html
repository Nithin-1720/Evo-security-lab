{% extends "base.html" %}

{% block content %}

<h1>
    Configure Authenticator MFA
</h1>

<p>
    Scan this QR code using Google Authenticator,
    Microsoft Authenticator, Authy, or another
    TOTP-compatible authenticator.
</p>


<div class="card">

    <img
        src="{{ qr_data }}"
        width="220"
        alt="TOTP QR code"
    >

    <p>
        Manual secret:
    </p>

    <code>
        {{ secret }}
    </code>

</div>


{% if error %}

<div class="error">
    {{ error }}
</div>

{% endif %}


<form
    action="/mfa/setup/totp"
    method="post"
>

    <label>
        Enter authenticator code
    </label>

    <input
        type="text"
        name="code"
        maxlength="6"
        required
    >

    <button type="submit">
        Enable TOTP
    </button>

</form>

{% endblock %}
