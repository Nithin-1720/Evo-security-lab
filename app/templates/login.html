{% extends "base.html" %}

{% block content %}

<div class="login-container">

    <div class="login-card">

        <h1>Evo Vulnerable AI Lab</h1>

        <p>
            Deliberately vulnerable application for
            application-security testing.
        </p>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form
            action="/login"
            method="post"
        >

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <div class="demo-accounts">

            <strong>Lab accounts</strong>

            <p>
                admin / LabAdmin123!
            </p>

            <p>
                analyst / LabAnalyst123!
            </p>

            <p>
                user / LabUser123!
            </p>

        </div>

    </div>

</div>

{% endblock %}
